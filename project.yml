name: SimplePDFReader
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    DEVELOPMENT_TEAM: 8777RK2R8M
    CODE_SIGN_STYLE: Automatic
targets:
  SimplePDFReader:
    type: application
    platform: iOS
    sources:
      - path: SimplePDFReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weihe.simplepdfreader
        PRODUCT_NAME: SimplePDFReader
        INFOPLIST_FILE: SimplePDFReader/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - SimplePDFReaderTests
        - SimplePDFReaderUITests
  SimplePDFReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SimplePDFReaderTests
    dependencies:
      - target: SimplePDFReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weihe.simplepdfreader.tests
        INFOPLIST_FILE: SimplePDFReaderTests/Info.plist
  SimplePDFReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SimplePDFReaderUITests
    dependencies:
      - target: SimplePDFReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weihe.simplepdfreader.uitests
        INFOPLIST_FILE: SimplePDFReaderUITests/Info.plist
